<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Taller de imágenes — Jungle Pixel Studio</title>
<link rel="stylesheet" href="fuentes.css">
<style>
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; background: #d6dcc8; color: #24382c; }

  #estado { margin: 0 0 16px; font-weight: 700; }

  figcaption { font-size: 12px; margin-top: 6px; }
  canvas { display: block; max-width: 600px; height: auto; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
</style>

<body>
<h1>Taller de imágenes</h1>
